<div class="min-h-screen bg-[#0f0f0f] flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-xl mb-4 overflow-hidden">
        <img src="images/logo.png" alt="TSM Logo" class="w-full h-full object-contain" />
      </div>
      <h1 class="text-2xl font-semibold text-white/90">TSM</h1>
      <p class="text-sm text-white/30 mt-1">Trade Management System</p>
    </div>

    <div class="bg-[#1a1a1a] rounded-2xl border border-white/10 p-8">
      <h2 class="text-lg font-semibold text-white/90 mb-2">Recuperar contraseña</h2>
      <p class="text-sm text-white/30 mb-6">
        Ingresá tu email y te enviaremos un código de 6 dígitos para recuperar tu cuenta.
      </p>

      @if (error()) {
        <div class="mb-4 px-4 py-3 bg-red-500/10 border border-red-500/20 rounded-lg text-sm text-red-400">
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-white/70 mb-1">Email</label>
          <input
            formControlName="email"
            type="email"
            placeholder="tu@email.com"
            class="w-full px-3 py-2.5 text-sm border rounded-lg outline-none transition-all
                   border-white/10 bg-white/5 text-white/90 focus:bg-white/[0.07] focus:border-indigo-500 focus:ring-2
                   focus:ring-indigo-500/20 placeholder:text-white/30"
            [class.border-red-500]="email.invalid && email.touched"
          />
          @if (email.invalid && email.touched) {
            <p class="mt-1 text-xs text-red-400">Ingresá un email válido</p>
          }
        </div>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-2.5 px-4 bg-indigo-500 hover:bg-indigo-600 disabled:bg-indigo-500/40
                 text-white text-sm font-medium rounded-lg transition-colors mt-2 cursor-pointer">
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
              </svg>
              Enviando código...
            </span>
          } @else {
            Enviar código
          }
        </button>
      </form>

      <p class="text-sm text-white/30 text-center mt-6">
        <a routerLink="/auth/login" class="text-indigo-400 hover:text-indigo-300 font-medium">
          Volver a iniciar sesión
        </a>
      </p>
    </div>
  </div>
</div>
