<div class="min-h-screen bg-[#0f0f0f] flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-xl mb-4 overflow-hidden">
        <img src="images/logo.png" alt="TSM Logo" class="w-full h-full object-contain" />
      </div>
      <h1 class="text-2xl font-semibold text-white/90">TSM</h1>
      <p class="text-sm text-white/30 mt-1">Trade Management System</p>
    </div>

    <!-- Card -->
    <div class="bg-[#1a1a1a] rounded-2xl border border-white/10 p-8">
      <h2 class="text-lg font-semibold text-white/90 mb-6">Iniciar sesión</h2>

      <!-- Error -->
      @if (error()) {
        <div class="mb-4 px-4 py-3 bg-red-500/10 border border-red-500/20 rounded-lg text-sm text-red-400">
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-white/70 mb-1">Email</label>
          <input
            formControlName="email"
            type="email"
            placeholder="tu@email.com"
            class="w-full px-3 py-2.5 text-sm border rounded-lg outline-none transition-all
                   border-white/10 bg-white/5 text-white/90 focus:bg-white/[0.07] focus:border-indigo-500 focus:ring-2
                   focus:ring-indigo-500/20 placeholder:text-white/30"
            [class.border-red-500]="email.invalid && email.touched"
          />
          @if (email.invalid && email.touched) {
            <p class="mt-1 text-xs text-red-400">Ingresá un email válido</p>
          }
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-white/70 mb-1">Contraseña</label>
          <div class="relative">
            <input
              formControlName="password"
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="••••••••"
              class="w-full px-3 py-2.5 pr-10 text-sm border rounded-lg outline-none transition-all
                    border-white/10 bg-white/5 text-white/90 focus:bg-white/[0.07] focus:border-indigo-500 focus:ring-2
                    focus:ring-indigo-500/20 placeholder:text-white/30"
              [class.border-red-500]="password.invalid && password.touched"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute inset-y-0 right-0 flex items-center pr-3 text-white/40 hover:text-white/70 cursor-pointer">
              @if (showPassword()) {
                <!-- Ojo tachado (ocultar) -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              } @else {
                <!-- Ojo abierto (mostrar) -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              }
            </button>
          </div>
          @if (password.invalid && password.touched) {
            <p class="mt-1 text-xs text-red-400">La contraseña es obligatoria</p>
          }
        </div>
        <div class="flex justify-end -mt-2">
          <a routerLink="/auth/forgot-password" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-2.5 px-4 bg-indigo-500 hover:bg-indigo-600 disabled:bg-indigo-500/40
                 text-white text-sm font-medium rounded-lg transition-colors mt-2 cursor-pointer">
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
              </svg>
              Ingresando...
            </span>
          } @else {
            Ingresar
          }
        </button>
      </form>

      <p class="text-sm text-white/30 text-center mt-6">
        ¿No tenés cuenta?
        <a routerLink="/auth/register" class="text-indigo-400 hover:text-indigo-300 font-medium">
          Registrate
        </a>
      </p>
    </div>
  </div>
</div>
